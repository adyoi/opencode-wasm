name: Deploy Pages

# Builds the site and publishes it to GitHub Pages.
#
# Pages source is "GitHub Actions" (see Settings -> Pages), so this workflow is
# what actually serves adyoi.github.io/opencode-wasm. Every push to main
# rebuilds from source and redeploys, so the committed build output is no longer
# what visitors get — it only serves as a fallback and for `npm run serve`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway: a half-published site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - run: npm ci

      - name: Build (runtime + terminal + wasm + standalone)
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Verify the wasm boots and carries the runtime
        run: |
          rm -f web/pkg/.gitignore
          node scripts/verify-build.mjs

      - name: Compose the site
        # Same shape as the repository: root redirect, the web/ app, and the
        # single-file build. .nojekyll keeps Pages from filtering the wasm.
        run: |
          rm -f web/pkg/.gitignore
          mkdir -p _site
          cp index.html _site/index.html
          cp -r web _site/web
          mkdir -p _site/dist
          cp dist/opencode-standalone.html _site/dist/opencode-standalone.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
