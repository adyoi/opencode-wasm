name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - run: npm ci

      - name: Build (runtime + terminal + wasm + standalone)
        run: npm run build

      - name: Run rust tests
        run: cargo test --manifest-path rust/Cargo.toml

      - name: Collect static site
        run: |
          mkdir -p _site
          cp -r web/* _site/
          cp web/pkg/.gitignore _site/pkg/.gitignore 2>/dev/null || true
          cp dist/opencode-standalone.html _site/opencode-standalone.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
