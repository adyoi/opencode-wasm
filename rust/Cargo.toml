[package]
name = "opencode-wasm"
version = "0.1.0"
edition = "2021"
description = "OpenCode agent runtime packaged as a single WebAssembly module"
license = "MIT"
repository = "https://github.com/adyoi/opencode-wasm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
